<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>ROC Employee Document Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=28" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Document library">
        <a class="brand" id="home-link" href="#docs/start-here.md">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 56 34" fill="none">
              <defs>
                <linearGradient id="roc-oval" x1="28" y1="0" x2="28" y2="34">
                  <stop offset="0" stop-color="#3d8eff" />
                  <stop offset="1" stop-color="#0052c2" />
                </linearGradient>
              </defs>
              <ellipse cx="28" cy="17" rx="26.2" ry="15.2" fill="url(#roc-oval)" />
              <ellipse cx="28" cy="17" rx="26.2" ry="15.2" stroke="#d7e3f2" stroke-width="1.6" />
              <text x="28" y="21.4" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700" font-family="IBM Plex Sans, Segoe UI, sans-serif" letter-spacing="1.4">ROC</text>
            </svg>
          </span>
          <span class="brand-copy">
            <strong>Remote Operations Center</strong>
            <small>Marine Technologies</small>
          </span>
        </a>

        <p class="sidebar-kicker">Document library</p>
        <nav id="section-nav" class="section-nav" aria-label="Document sections"></nav>

        <div class="sidebar-foot">
          <span>Internal use</span>
          <span>Draft documents</span>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button id="nav-toggle" class="icon-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open document library">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>

          <div class="title-block">
            <p class="eyebrow" id="document-section">Library</p>
            <h1 id="document-title">ROC Employee Document Portal</h1>
          </div>

          <div class="actions">
            <span class="env-pill">Internal</span>
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to night mode" aria-pressed="false"></button>
          </div>
        </header>

        <main class="content-shell">
          <article id="document-content" class="document-content" tabindex="-1">
            <div class="empty-state">
              <p>Select a document from the library.</p>
            </div>
          </article>
        </main>
      </div>
    </div>

    <div class="nav-backdrop" id="nav-backdrop" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="documents.js?v=28"></script>
    <script src="app.js?v=28"></script>
  </body>
</html>
